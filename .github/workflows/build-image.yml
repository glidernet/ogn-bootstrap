name: Build receiver image

# Builds the "OGN Receiver" image that appears in Raspberry Pi Imager, publishes
# it as a release asset, and updates os-list.json so Imager picks it up.
#
# What this workflow does on GitHub's runners, stated plainly because it is the
# only part of this repository that downloads and executes third-party code:
#
#   * downloads Raspberry Pi OS Lite (64-bit) from downloads.raspberrypi.com
#     over TLS, and verifies it against the SHA256 in Raspberry Pi's own OS list
#   * installs qemu-user-static from Ubuntu so arm64 binaries can run
#   * loop-mounts the image and runs apt inside it, which fetches and runs
#     package maintainer scripts from the Debian and Raspberry Pi archives
#   * publishes the result under this repository's releases
#
# It runs on GitHub-hosted runners only, never on a developer machine, and
# tools/build-image.sh refuses to start anywhere that is not Linux with root.
#
# ---------------------------------------------------------------------------
# WHY THIS IS TWO JOBS
#
# Running apt in a chroot means running root-owned maintainer scripts written by
# other people. A chroot is not a security boundary and neither is a privileged
# container: both need /dev, loop devices and CAP_SYS_ADMIN, and anything with
# those can reach the host. So isolating the build buys very little.
#
# What a package postinst could actually do damage with is this repository's
# credentials — pushing a tampered image, or rewriting os-list.json so every
# receiver installs it. That is worth defending, and it is defended by keeping
# the credentials out of the job that runs the untrusted code:
#
#   build    no token at all (permissions: {}), no persisted git credentials.
#            Runs the chroot. Its only output is an artifact.
#   publish  contents: write, but runs nothing from outside this repository.
#            Downloads the artifact, re-checks its hashes, and releases it.
#
# An escape in `build` gets an ephemeral VM that is about to be destroyed. It
# does not get the ability to publish.
# ---------------------------------------------------------------------------

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (on a branch: a pre-release test build with its own os-list.json)'
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {}

    steps:
      - uses: actions/checkout@v4
        with:
          # Without this, checkout leaves a usable token in .git/config for the
          # rest of the job — including for everything the chroot runs.
          persist-credentials: false

      # The image, a copy of it and the compressed output together need most of
      # the runner's disk. The preinstalled toolchains are several gigabytes we
      # have no use for.
      - name: Free up disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet
          df -h /

      # qemu-user-static registers the arm64 binfmt handler as part of its
      # postinst, so the chroot works without any third-party action.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static parted xz-utils
          ls -l /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Check the payload is in step with src/
        run: tools/build-vendor-data && git diff --exit-code boot/vendor-data

      - name: Build
        run: sudo --preserve-env=OGN_VERSION tools/build-image.sh
        env:
          OGN_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

      - name: Summarise
        run: |
          {
            echo '## Image'
            echo '```json'
            cat dist/image-meta.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ogn-receiver-image
          path: |
            dist/*.img.xz
            dist/image-meta.json
          retention-days: 7

  # Only a tag, or a manual run that asked for it, gets published.
  #
  # A tag is a release: it updates os-list.json on master, which is the URL
  # every receiver's Imager is pointed at.
  #
  # Anything else is a test build. It gets its own release, marked pre-release,
  # with its own os-list.json attached as an asset -- so there is a URL to paste
  # into Imager that does not touch the one real users follow. It is named after
  # the branch in Imager's list so it cannot be mistaken for the live image.
  publish:
    needs: build
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # A release build edits master, so it checks master out. A test build
      # must not, and checking out the branch also means make-os-list is the
      # version being tested rather than whatever master happens to hold.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && 'master' || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: ogn-receiver-image
          path: dist

      # image-meta.json is what os-list.json is built from, and Imager refuses
      # any image whose extract_sha256 does not match. Confirm the compressed
      # file we are about to publish is the one it describes.
      - name: Verify the artifact matches its metadata
        run: |
          set -euo pipefail
          img=$(ls dist/*.img.xz)
          want=$(python3 -c 'import json; print(json.load(open("dist/image-meta.json"))["image_download_sha256"])')
          got=$(sha256sum "$img" | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "artifact SHA256 mismatch: $want != $got"; exit 1; }
          echo "ok: $(basename "$img")"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          img=$(ls dist/*.img.xz)
          meta() { python3 -c 'import json,sys; print(json.load(open("dist/image-meta.json"))[sys.argv[1]])' "$1"; }
          base=$(meta base_image)

          if [ "${{ github.ref_type }}" = tag ]; then
            tag=${{ github.ref_name }}
            prerelease=
            target=
            listing="https://raw.githubusercontent.com/${{ github.repository }}/master/os-list.json"
            title=$tag
          else
            # Dated, not numbered. This is the build date out of image-meta.json
            # rather than today's date on this runner: the build job ahead of
            # this one can run for an hour and a half, so the two disagree
            # across midnight, and it is the one already in the .img.xz filename.
            #
            # A second build of the same branch on the same day reuses the
            # release and clobbers its assets, which keeps the URL you pasted
            # into Imager working. Two *different* branches built on one day
            # land on the same tag as well -- the title and the Imager entry
            # name both say which branch, but the later one wins.
            tag=$(meta release_date)
            prerelease=--prerelease
            # Without a target, gh creates the tag at the default branch, which
            # is how build-5's tag ended up on master rather than on the commit
            # that was actually built.
            target="--target ${{ github.sha }}"
            # The per-build list, attached below. Pointing a test build at the
            # master URL is what made the last one indistinguishable from -- and
            # in fact replace -- the live image.
            listing="https://github.com/${{ github.repository }}/releases/download/$tag/os-list.json"
            title="$tag (test build of ${{ github.ref_name }})"
          fi

          notes=$(cat <<EOF
          Raspberry Pi OS Lite (64-bit) with the OGN receiver software preinstalled.

          Add this to Raspberry Pi Imager as a custom repository
          (Settings, or \`rpi-imager --repo <url>\`):

              $listing

          Built from \`$base\`, ref \`${{ github.ref_name }}\` (\`${{ github.sha }}\`).
          EOF
          )

          # Refresh title and notes on a reuse, so a same-day rebuild does not
          # leave notes naming the previous commit. The tag itself stays where
          # it was first created; the notes are what say which commit the
          # attached image is from.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" --title "$title" --notes "$notes" $prerelease $target
          fi
          gh release upload "$tag" "$img" dist/image-meta.json --clobber

          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/$tag/$(basename "$img")" >> "$GITHUB_ENV"

      # Both paths build the same file; only where it ends up differs.
      - name: Build os-list.json
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = tag ]; then
            tools/make-os-list --meta dist/image-meta.json --url "$DOWNLOAD_URL" --out os-list.json
          else
            short=$(echo '${{ github.sha }}' | cut -c1-7)
            tools/make-os-list --meta dist/image-meta.json --url "$DOWNLOAD_URL" --out os-list.json \
              --name "OGN Receiver TEST ${{ github.ref_name }} ($short)" \
              --note "TEST BUILD -- not the released receiver image."
          fi

      # A test build stops here: the list rides along with the release it
      # describes, and master keeps pointing at the last real image.
      - name: Attach os-list.json to the test release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" os-list.json --clobber
          {
            echo '## Test image'
            echo 'Add this to Raspberry Pi Imager as a custom repository:'
            echo
            echo "    https://github.com/${{ github.repository }}/releases/download/$TAG/os-list.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update os-list.json on master
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Stage first, then compare the index against HEAD. `git diff` on its
          # own only looks at tracked files, so while os-list.json was untracked
          # it reported "no change" and the commit below was never reached --
          # which is why the file it is supposed to maintain never appeared.
          git add os-list.json
          if git diff --cached --quiet -- os-list.json; then
            echo 'os-list.json already current'
          else
            git commit -m "os-list.json: ${{ github.ref_name }}"
            # The build ahead of this can run for an hour and a half, so master
            # may have moved since the checkout. Without this the push is
            # rejected non-fast-forward and the release ships with os-list.json
            # still pointing at the previous image.
            git pull --rebase origin master
            git push origin HEAD:master
          fi
