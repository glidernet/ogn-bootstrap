# ---------------------------------------------------------------------------
#  OGN receiver configuration
#
#  Edit the four lines marked TODO below, save the file, eject the card and
#  put it in the Raspberry Pi. That is the whole setup.
#
#  Lines starting with # are comments and are ignored.
#  Every setting ends with a semicolon. Keep them.
#
#  Full documentation: https://github.com/glidernet/ogn-bootstrap
# ---------------------------------------------------------------------------

APRS:
{ # TODO 1 of 4 — your receiver's name, as it will appear on the OGN network
  #   and on https://live.glidernet.org
  #
  # Up to 9 characters. Letters and digits only: no spaces, no punctuation,
  # no accented characters. Usually the airfield's ICAO code or a short form
  # of its name, e.g. "Lasham", "EGHL", "Salanda".
  #
  # Leave it as "" and the hostname you typed into Raspberry Pi Imager is
  # used instead, which is usually what you want.
  #
  # Names are expected to follow the community convention:
  #   http://wiki.glidernet.org/receiver-naming-convention
  Call = "";
} ;

Position:
{ # TODO 2 and 3 of 4 — where the ANTENNA is.
  #
  # Not the clubhouse, not the middle of the airfield: the actual mast or
  # rooftop the aerial is bolted to. If it is more than about 100 m out, the
  # range maps drawn from this receiver will be wrong.
  #
  # Decimal degrees, NOT degrees and minutes.
  #   north and east are positive      51.1874    9.0000
  #   south and west are negative     -33.9500   -1.0324
  # Four decimal places is about 10 m, which is plenty.
  #
  # If you have the position as 51 11.244 N, that is 51 + 11.244/60 = 51.1874.
  # Right-clicking the spot in Google Maps gives you the decimal form directly.
  Latitude   =    +0.0000;
  Longitude  =    +0.0000;

  # TODO 4 of 4 — height of the ANTENNA above mean sea level, in METRES.
  #
  # This is the ground elevation AMSL plus how far up the mast or roof the
  # aerial actually sits. It is NOT the height of the mast on its own, and
  # NOT the height above the ground.
  #
  #   e.g. airfield 120 m AMSL, aerial 8 m up a mast  ->  128
  #
  # A rough figure is fine: plus or minus 10 m will not hurt anything.
  #
  # Do not enter feet. 500 ft is 152, not 500. If your airfield elevation is
  # published in feet, divide by 3.281.
  Altitude   =          0;

  # GeoidSepar is deliberately not set here, and you should not add it.
  #
  # The installer downloads the EGM96 geoid grid (WW15MGH.DAC) so the decoder
  # works out the right correction for your exact location. Setting a single
  # number by hand here would override that and be less accurate.
} ;

RF:
{ # Which SDR stick this receiver listens on, when more than one is plugged in.
  #
  # With a single dongle leave this alone: 0 is the only one there is, and
  # everything below applies to it.
  #
  # A second dongle is normally there for ADS-B — see the ADSB section near the
  # bottom of this file. Index numbers are handed out in USB enumeration order,
  # so they can swap over when you re-plug something or move the Pi to a
  # different port. On a two-dongle receiver use DeviceSerial instead.
  #
  # `rtl_test` lists what is plugged in, with the index and serial of each.
  Device     =    0;

  # Select the stick by its serial number instead, which never moves around.
  #
  # Uncomment this and Device above is ignored. Sticks usually leave the
  # factory with the serial "00000000"; an RTL-SDR Blog V3/V4 can be relabelled
  # with `rtl_eeprom -s 868`, which is the usual way to tell two of them apart.
  #
  # DeviceSerial = "868";

  # Frequency error of your SDR stick, in parts per million.
  #
  # Leave at 0 unless you have measured it. TCXO sticks — RTL-SDR Blog V3 and
  # V4, silver or orange cases — need nothing here. Plain black or blue R820T
  # sticks are often 40 to 80 out and drift as they warm up.
  FreqCorr   =   +0;

  # Set true, put the card back, power up. The receiver listens to the local
  # GSM carriers and writes FreqCorr above and GSM below, here on this card,
  # then sets this back to false. The card is where you read the result: the
  # Pi has no screen and its logs are thrown away at every reboot.
  #
  # It needs the aerial connected and GSM coverage, and stops the receiver for
  # up to three minutes. A masthead amplifier or filtered antenna usually
  # blocks the band it listens to; it will say so here when it gives up.
  #
  # A successful run also switches on continuous GSM tracking, by filling in
  # GSM.CenterFreq below. Set that back to 0 if you do not want it.
  Calibrate  = false;

  # Sampling bandwidth in MHz. 2.0 captures FLARM, OGN, FANET and PilotAware
  # together and is worth the slightly higher CPU load on any modern Pi.
  SampleRate = 2.0;

  GSM:
  { # Continuous frequency tracking, for as long as the receiver runs. This is
    # not the same as Calibrate above, which measures once and then stops.
    #
    #   CenterFreq = 0       OFF. No GSM listening during normal running.
    #                        This is how the receiver ships.
    #   CenterFreq = 938.6   ON, tracking that channel, permanently.
    #
    # ** To switch it off, set this back to 0. ** That includes switching it
    # off after Calibrate has filled it in. Deleting the whole GSM section
    # does the same thing.
    #
    # Leave it off if your stick has a TCXO (RTL-SDR Blog V3/V4), if there is
    # no GSM mast within range, or if the aerial is filtered or has a masthead
    # amplifier — those all block the band it listens to.
    #
    # By hand: 938.6 suits much of Europe; a 915.0 receiver wants a GSM-850
    # channel, 869 to 894.
    CenterFreq =   0;

    # Only used when CenterFreq is not 0. GSM signals are very strong — this
    # is much lower than the OGN gain below, and is not a typo.
    Gain       =  25.0;
  } ;

  OGN:
  { # Band centre in MHz.
    #   868.8  Europe, Africa, most of Asia     <- the default
    #   915.0  Americas and Israel
    CenterFreq = 868.8;

    # RF gain in dB. Full gain is normally correct. Reduce it only if you are
    # running a masthead amplifier or are seeing intermodulation from nearby
    # transmitters.
    Gain       =  50.0;
  } ;

  # Bias-T: sends about 4.5 V up the coax to power a masthead amplifier.
  #
  # *** LEAVE THIS OFF unless you KNOW your antenna needs it.             ***
  # *** Switching it on with an ordinary passive antenna puts DC into a   ***
  # *** short circuit and can destroy the SDR dongle.                     ***
  #
  # BiasTee = 1;
} ;

HTTP:
{ # Built-in status pages:
  #
  #   http://<your-pi>:8082/   RF front end — signal levels, noise, drift
  #   http://<your-pi>:8083/   decoder — what it is actually hearing
  #
  # Only the first is set here. The decoder's page is always one port up and
  # cannot be moved separately.
  #
  # 8080 is deliberately left free. That is where dump1090, readsb and tar1090
  # put their map if you ever add an ADS-B receiver alongside this one, and it
  # is the same numbering the community's ogn-pi34 scripts use, so instructions
  # written for those apply here unchanged.
  #
  # Leave it alone unless it clashes with something else you are running.
  Port = 8082;
} ;

# ---------------------------------------------------------------------------
#  ADS-B — commented out, and doing nothing.
#
#  A SECOND SDR stick, listening on 1090 MHz, so this receiver also sees the
#  airliners and the transponder-equipped traffic that FLARM never shows. It
#  has nothing to do with ordinary OGN reception, which needs none of it.
#
#  What it does, once switched on:
#
#    * decodes ADS-B with readsb, which is already on this image
#    * hands that traffic to the OGN decoder, so it reaches the network
#    * optionally shares it with the tracking sites you pick under Feed below
#
#  Leave the section commented and none of it happens: no second decoder, no
#  ADS-B, and nothing sent anywhere new. That is the shipped state.
#
#  To use it:
#
#    1. Plug in a second dongle. A 1090 MHz aerial is a different length from
#       an 868 one; the stock whip will hear aircraft overhead and not much
#       else.
#    2. Give the two sticks different serials so they cannot trade places:
#       `rtl_eeprom -s 868` on one, `rtl_eeprom -s 1090` on the other. Then
#       set RF.DeviceSerial at the top of this file to the OGN one, and
#       DeviceSerial below to the ADS-B one. `rtl_test` lists what is plugged
#       in. Getting these the same way round is the one mistake that stops
#       both from working.
#    3. Uncomment this whole section and reboot.
#
#  Note the AVR and MaxAlt keys are not in upstream's documented config
#  reference, though they are in wide use. If your decoder rejects them,
#  comment those two back out; the rest of this section is read by
#  ogn-bootstrap, not by the decoder, and is unaffected.
# ---------------------------------------------------------------------------

# ADSB:
# {
#   Enable       = true;
#
#   # The ADS-B stick, by serial — the one that is NOT RF.DeviceSerial.
#   DeviceSerial = "1090";
#
#   # [dB] Tuner gain. -10 hands the decision to the tuner, which is right
#   # until you are chasing the last few miles of range.
#   Gain         = -10;
#
#   # Where the OGN decoder reads ADS-B from, in AVR format. 30002 is
#   # readsb's raw AVR output — not 30003, which is SBS, and not 30005,
#   # Beast. Leave this alone: it is the local handover, not a feed.
#   AVR    = "localhost:30002";
#
#   # [ft] Ignore anything above this height. Airliners in the flight levels
#   # are of no interest to a gliding network and only cost you upload.
#   MaxAlt = 18000;
#
#   # -----------------------------------------------------------------------
#   #  Sharing what you receive, with tracking sites outside OGN.
#   #
#   #  All false: nothing leaves this Pi except the OGN traffic it already
#   #  sends. Switch one on and this receiver connects out to that site and
#   #  streams every aircraft it hears, continuously. None of them needs an
#   #  account or a key, and none of them can reach back in.
#   #
#   #  Your decision, site by site.
#   # -----------------------------------------------------------------------
#   Feed:
#   {
#     ADSBExchange  = false;
#     ADSBFi        = false;
#     ADSBLol       = false;
#     AirplanesLive = false;
#
#     # Multilateration: the sites above compare arrival times across several
#     # receivers to place aircraft that give no position of their own. It
#     # sends your timings to whichever of them are switched on, and needs
#     # the Position at the top of this file to be right to a few metres.
#     # A wrong position here spoils other people's results, not just yours.
#     MLAT          = false;
#
#     # Anywhere else, as "host:port, host:port". Beast format.
#     #   Custom = "feed.example.org:30004";
#     Custom        = "";
#   } ;
# } ;

# ---------------------------------------------------------------------------
#  Network — re-read from the card on EVERY boot.
#
#  How you change the wifi on a receiver you can no longer reach: card into
#  any laptop, edit, put it back. The wifi NetworkManager really uses is on
#  the Linux partition, which Windows and macOS cannot open.
# ---------------------------------------------------------------------------

Network:
{
  Wifi:
  { # Empty SSID does nothing and leaves the wifi you gave Imager alone, which
    # is the normal case. Fill it in only to change the wifi after the fact.
    #
    # The password is in clear here, on a partition any laptop can read. So is
    # Imager's, so this is nothing new — but treat the card accordingly.
    # On the Pi it is root's alone: this partition mounts umask=0077.
    SSID     = "";
    Password = "";

    # "GB", "DE", "US". Imager sets this, and the radio stays off until
    # something does, so you need it only if the receiver has moved country.
    Country  = "";

    # Only for a network that does not broadcast its name.
    Hidden   = false;
  } ;

  # -------------------------------------------------------------------------
  #  WireGuard — a tunnel out to a VPN server you run, so you can reach this
  #  receiver from anywhere. Off unless you fill it in.
  #
  #  Make the keys on any machine with wireguard-tools:
  #      wg genkey | tee receiver.key | wg pubkey > receiver.pub
  #  receiver.key goes in PrivateKey below, receiver.pub on the server.
  #
  #  *** The private key is in clear on this card. Give each receiver its   ***
  #  *** own, so a lost card revokes one receiver and not the lot.          ***
  # -------------------------------------------------------------------------

  WireGuard:
  {
    Enable      = false;

    # This receiver's own key, 44 characters of base64.
    PrivateKey  = "";

    # Its address inside the VPN. /32 is almost always right.
    #   Address = "10.6.0.7/32";
    Address     = "";

    # 0 works it out. Set it only if the tunnel comes up but large
    # transfers hang; some 4G and PPPoE links want 1380.
    MTU         = 0;

    Peer:
    {
      # The SERVER's public key, not this receiver's.
      PublicKey           = "";

      # Re-resolved if the handshake stops, so dynamic DNS is fine.
      #   Endpoint = "vpn.example.org:51820";
      Endpoint            = "";

      # What is routed into the tunnel. Your VPN subnet, normally.
      # "0.0.0.0/0" sends the OGN uplink through your server too, and
      # needs nftables or iptables here.
      #   AllowedIPs = "10.6.0.0/24";
      AllowedIPs          = "";

      # Only if your server is configured with one.
      PresharedKey        = "";

      # [s] Stops the airfield's NAT forgetting this receiver, which is
      # what lets you connect in. 0 switches it off.
      PersistentKeepalive = 25;
    } ;
  } ;
} ;

# ---------------------------------------------------------------------------
#  Installer settings
#
#  These describe how the machine was built, so changing one re-runs the
#  installer at the next boot rather than just being copied into place.
#
#  The OGN receiver software itself ignores this whole section.
# ---------------------------------------------------------------------------

Install:
{ # Run the root filesystem read-only, in RAM, once setup has finished.
  #
  # This is the single most effective thing you can do to stop an SD card
  # wearing out or corrupting, which is far and away the commonest reason a
  # receiver dies in the field. Strongly recommended for anything you are
  # not sitting next to.
  #
  # While it is on, changes to the system are discarded at every reboot.
  # Updates are handled for you in the maintenance window below.
  ReadOnlyFS       = true;

  # Reboot automatically when setup finishes.
  # Required for ReadOnlyFS to actually take effect.
  RebootWhenDone   = true;

  # Which OGN software to install and track.
  #   "stable"   the version known to work, recommended
  #   "latest"   newest published, for testing
  #   "0.3.2"    pin to one exact version and never move
  UpdateChannel    = "stable";

  # When to install security updates and any new OGN version.
  # systemd calendar format. The receiver reboots twice inside this window.
  # Set to "" to never update automatically.
  #
  # Monday, not Sunday: a broken update is then found with a week to fix it,
  # not on a flying morning. Start is spread over the following half hour.
  MaintenanceWindow = "Mon *-*-* 03:00:00";

  # Remote access. All three are OFF by default and independent of each other.
  # SSH from your own network keeps working regardless of what is set here.
  # Network.WireGuard above is a fourth way in, involving nobody else.
  RemoteAdmin:
  { # Raspberry Pi Connect: a shell in your browser, through NAT and
    # firewalls, using your Raspberry Pi ID. Nothing to forward.
    # https://www.raspberrypi.com/documentation/services/connect.html
    Connect = false;

    # Optional. An organisation auth key links this Pi to your Connect
    # account with no sign-in step. Leave empty and the sign-in link is
    # printed when you log in instead. A credential, like the wifi password:
    # in clear on this card, root-only on the Pi.
    ConnectAuthKey = "";

    # Give the OGN core team a shell on this receiver, over a reverse SSH
    # tunnel they can reach at any time, so they can help diagnose problems.
    #
    # This grants a third party root-capable access to this machine and to
    # whatever network it sits on. Useful for a club receiver nobody local
    # can maintain. Your decision to make.
    OGNTeam = false;

    # Extra SSH public keys allowed to log in, on top of any you gave to
    # Raspberry Pi Imager. One key per line, OpenSSH format.
    ExtraSSHKeys = "";
  } ;
} ;
