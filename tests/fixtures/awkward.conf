// A deliberately awkward config, used by the parser tests.
# Both comment styles, and a /* block
/* spanning
   several lines */ 
APRS:
{ Call = "Tricky9";   // trailing comment with a // inside it
} ;

Position:
{ Latitude  = -33.9500;
  Longitude = +151.2000;

  Altitude  =  128;
} ;

Strings:
{ WithSlashes  = "http://example.com/not?a=comment";
  WithHash     = "a # b";
  WithSemi     = "a ; b";
  WithBrace    = "a } b {";
  WithEscape   = "she said \"hello\"";
  Empty        = "";
  Spaced       = "Sun *-*-* 03:00:00";
} ;

Nest:
{ Level2:
  { Level3:
    { Deep = 42;
    } ;
    Shallow = true;
  } ;
  Sibling = false;
} ;

Arrays:
{ List = [ "one", "two", "three" ];
  After = 7;
} ;

// The terminator is optional in libconfig. A last value without one must not
// swallow the closing brace, or everything after it lands in the wrong group.
NoSemi:
{ First  = 1
  Last   = 54
} ;

AfterNoSemi:
{ Commas = 3, Next = "x",
  Inline = 9 } ;
